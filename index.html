<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>家計ログ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;min-height:100%;background:#f5f5f7;font-family:system-ui,sans-serif;color:#444}
  .box{padding:48px 20px;text-align:center;max-width:420px;margin:0 auto}
  img{width:96px;height:96px;border-radius:20px}
  h1{font-size:22px;margin:12px 0 4px}
  p{line-height:1.7}
  .btn{display:block;width:100%;box-sizing:border-box;margin-top:14px;padding:14px;border:0;border-radius:10px;
       background:#1a73e8;color:#fff;font-size:16px;text-decoration:none}
  .sub{background:#fff;color:#1a73e8;border:1px solid #1a73e8}
  .note{font-size:13px;color:#777;text-align:left;background:#fff;border-radius:10px;padding:12px 14px;margin-top:20px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="box">
  <img src="icon-192.png" alt="">
  <h1>家計ログ</h1>

  <!-- アプリとして起動したとき -->
  <div id="launching" hidden>
    <p>開いています…</p>
    <a class="btn" id="openApp" href="#">開かない場合はこちら</a>
  </div>

  <!-- ブラウザで開いたとき -->
  <div id="browser" hidden>
    <button class="btn" id="installBtn" hidden>アプリをインストール</button>
    <div class="note" id="manual">
      インストールボタンが出ない場合は、Chromeの右上の「⋮」メニューから
      「アプリをインストール」または「ホーム画面に追加」→「インストール」を選んでください。
    </div>
    <a class="btn sub" id="openWeb" href="#">インストールせずに開く</a>
  </div>

  <div id="offline" hidden>
    <p>オフラインのため開けません。<br>電波のある場所で再度開いてください。</p>
    <a class="btn" href="./">再読み込み</a>
  </div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwbi8TNKteRQBujdOaZvZRtCQtlKJZEtEbp7TfLovJDRUb99RmmQMZNATtWreMeUcAZ/exec';

  const $ = id => document.getElementById(id);
  $('openApp').href = GAS_URL;
  $('openWeb').href = GAS_URL;

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  const standalone =
    matchMedia('(display-mode: standalone)').matches ||
    new URLSearchParams(location.search).get('source') === 'pwa';

  if (!navigator.onLine) {
    $('offline').hidden = false;
    window.addEventListener('online', () => location.reload());
  } else if (standalone) {
    // インストール済みアプリとして起動 → GASへ
    $('launching').hidden = false;
    location.replace(GAS_URL);
  } else {
    // ブラウザで開いた → インストール案内
    $('browser').hidden = false;
  }

  // Chromeがインストール可能と判断したらボタンを出す
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    $('installBtn').hidden = false;
    $('manual').hidden = true;
  });
  $('installBtn').onclick = async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
    $('installBtn').hidden = true;
  };
  window.addEventListener('appinstalled', () => {
    $('browser').innerHTML = '<p>インストールしました。<br>ホーム画面の「家計ログ」から開いてください。</p>';
  });
</script>
</body>
</html>
