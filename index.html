<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>家計ログ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#f5f5f7;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f5f7}
  #offline{display:none;font-family:system-ui,sans-serif;padding:40px 20px;text-align:center;color:#555}
  body.off iframe{display:none}
  body.off #offline{display:block}
</style>
</head>
<body>
<iframe id="app" title="家計ログ" allow="clipboard-write"></iframe>
<div id="offline">
  <p>オフラインのため開けません。<br>電波のある場所で再度開いてください。</p>
  <p><button onclick="location.reload()">再読み込み</button></p>
</div>
<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwbi8TNKteRQBujdOaZvZRtCQtlKJZEtEbp7TfLovJDRUb99RmmQMZNATtWreMeUcAZ/exec';

  if (navigator.onLine) {
    document.getElementById('app').src = GAS_URL;
  } else {
    document.body.classList.add('off');
  }
  window.addEventListener('online', () => location.reload());

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
