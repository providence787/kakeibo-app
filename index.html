<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>家計ログ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#f5f5f7;font-family:system-ui,sans-serif;color:#555}
  .box{padding:60px 20px;text-align:center}
  a.btn{display:inline-block;margin-top:16px;padding:12px 24px;background:#1a73e8;color:#fff;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<div class="box" id="msg">
  <p>家計ログを開いています…</p>
  <a class="btn" id="open" href="#">開かない場合はこちら</a>
</div>
<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwbi8TNKteRQBujdOaZvZRtCQtlKJZEtEbp7TfLovJDRUb99RmmQMZNATtWreMeUcAZ/exec';

  document.getElementById('open').href = GAS_URL;

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  if (navigator.onLine) {
    // 履歴に残さず移動（戻るボタンでこの画面に戻らないように）
    location.replace(GAS_URL);
  } else {
    document.getElementById('msg').innerHTML =
      '<p>オフラインのため開けません。<br>電波のある場所で再度開いてください。</p>' +
      '<p><a class="btn" href="./">再読み込み</a></p>';
    window.addEventListener('online', () => location.replace(GAS_URL));
  }
</script>
</body>
</html>
